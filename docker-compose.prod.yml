version: "3.9"

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    restart: always
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    volumes: []  # Override dev volumes
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
      replicas: 2
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    restart: always
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    volumes: []  # Override dev volumes
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  coturn:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
